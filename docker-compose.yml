services:
  nexus:
    container_name: nexus-ai
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXUS_HOST: 0.0.0.0
      NEXUS_PORT: 3000
      NEXUS_DATA_DIR: /var/lib/nexus/data
      NEXUS_DB_FILE: /var/lib/nexus/data/nexus.db
      NEXUS_WORKSPACE: /var/lib/nexus/workspace
      NEXUS_WORKSPACES_DIR: /var/lib/nexus/workspaces
      NEXUS_REQUIRE_AUTH: "true"
      NEXUS_REQUIRE_APPROVALS: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - nexus-data:/var/lib/nexus
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nexus-data:
    name: nexus-ai-data
